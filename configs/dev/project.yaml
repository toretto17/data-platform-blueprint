project: "mycompany"
feature: "analytics"
environment: "dev"
account_id: "503561443692"
region: "ap-southeast-1"

buckets:
  silver: "s3-mycompany-analytics-dev-silver-${account_id}"
  gold: "s3-mycompany-analytics-dev-gold-${account_id}"
  consumption: "s3-mycompany-analytics-dev-consumption-${account_id}"
  feature_store: "s3-mycompany-analytics-dev-feature-${account_id}"
  ml_results: "s3-mycompany-analytics-dev-ml-results-${account_id}"
  artifactory: "s3-mycompany-analytics-dev-artifactory-${account_id}"

databases:
  silver: "analytics_silver"
  gold: "analytics_gold"
  consumption: "insights_consumption_layer"

iam:
  glue_role: "arn:aws:iam::${account_id}:role/GlueServiceRole-dev-mycompany"
  sagemaker_role: "arn:aws:iam::${account_id}:role/iam-mycompany-mlops-dev-sagemaker-default-execution-role"

# Databricks (if applicable)
databricks:
  catalog: "dev"
  schema: "analytics"
  workspace_url: "https://CHANGE_ME.cloud.databricks.com"
