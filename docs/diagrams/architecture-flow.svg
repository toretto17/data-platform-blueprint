<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none">
  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#58a6ff">DATA PLATFORM BLUEPRINT — End-to-End Architecture</text>
  
  <!-- Animated flowing dots path -->
  <path id="flowPath" d="M 80 160 L 240 160 L 400 160 L 560 160 L 720 160 L 900 160 L 1080 160" stroke="none" fill="none"/>
  
  <!-- Connection lines -->
  <line x1="175" y1="160" x2="225" y2="160" stroke="#30363d" stroke-width="3" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="335" y1="160" x2="385" y2="160" stroke="#30363d" stroke-width="3" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="495" y1="160" x2="545" y2="160" stroke="#30363d" stroke-width="3" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="655" y1="160" x2="705" y2="160" stroke="#30363d" stroke-width="3" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="815" y1="160" x2="880" y2="120" stroke="#30363d" stroke-width="2" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="815" y1="160" x2="880" y2="160" stroke="#30363d" stroke-width="2" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="815" y1="160" x2="880" y2="200" stroke="#30363d" stroke-width="2" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
  </line>
  
  <!-- ML branch line -->
  <line x1="560" y1="180" x2="560" y2="260" stroke="#30363d" stroke-width="2" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <line x1="560" y1="260" x2="720" y2="260" stroke="#30363d" stroke-width="2" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <line x1="720" y1="260" x2="880" y2="260" stroke="#30363d" stroke-width="2" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <line x1="880" y1="260" x2="1030" y2="260" stroke="#30363d" stroke-width="2" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1.5s" repeatCount="indefinite"/>
  </line>
  
  <!-- SOURCES -->
  <rect x="60" y="120" width="120" height="80" rx="12" fill="#1a3a5c" stroke="#58a6ff" stroke-width="2">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="120" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#58a6ff">☁️ SOURCES</text>
  <text x="120" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8b949e">S3 | JDBC | Kafka</text>
  
  <!-- BRONZE -->
  <rect x="220" y="120" width="120" height="80" rx="12" fill="#3d2800" stroke="#f0883e" stroke-width="2">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" begin="0.3s"/>
  </rect>
  <text x="280" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#f0883e">🥉 BRONZE</text>
  <text x="280" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8b949e">Raw Landing</text>
  <text x="280" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#6e7681">Append + Lineage</text>
  
  <!-- SILVER -->
  <rect x="380" y="120" width="120" height="80" rx="12" fill="#0d3320" stroke="#3fb950" stroke-width="2">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" begin="0.6s"/>
  </rect>
  <text x="440" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#3fb950">🥈 SILVER</text>
  <text x="440" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8b949e">Cleansed</text>
  <text x="440" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#6e7681">Dedup + DQ + Cast</text>
  
  <!-- GOLD -->
  <rect x="540" y="120" width="120" height="80" rx="12" fill="#3d3000" stroke="#d29922" stroke-width="2">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" begin="0.9s"/>
  </rect>
  <text x="600" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#d29922">🥇 GOLD</text>
  <text x="600" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8b949e">Aggregated</text>
  <text x="600" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#6e7681">MTD/YTD + Windows</text>
  
  <!-- CONSUMPTION -->
  <rect x="700" y="120" width="120" height="80" rx="12" fill="#2d1b4e" stroke="#a371f7" stroke-width="2">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" begin="1.2s"/>
  </rect>
  <text x="760" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a371f7">🍽️ CONSUME</text>
  <text x="760" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8b949e">BI Ready</text>
  <text x="760" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#6e7681">Warehouse + API</text>
  
  <!-- SERVING TARGETS -->
  <rect x="880" y="90" width="100" height="40" rx="8" fill="#1c2128" stroke="#8b949e" stroke-width="1"/>
  <text x="930" y="114" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8b949e">📊 Redshift/DBSQL</text>
  
  <rect x="880" y="140" width="100" height="40" rx="8" fill="#1c2128" stroke="#8b949e" stroke-width="1"/>
  <text x="930" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8b949e">❄️ Snowflake</text>
  
  <rect x="880" y="190" width="100" height="40" rx="8" fill="#1c2128" stroke="#8b949e" stroke-width="1"/>
  <text x="930" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8b949e">🌐 REST API</text>
  
  <!-- ML BRANCH -->
  <rect x="480" y="240" width="100" height="50" rx="10" fill="#3b1520" stroke="#f85149" stroke-width="2">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="530" y="262" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#f85149">📦 Feature</text>
  <text x="530" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#f85149">Store</text>
  
  <rect x="640" y="240" width="100" height="50" rx="10" fill="#3b1520" stroke="#f85149" stroke-width="2">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
  <text x="690" y="262" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#f85149">🏋️ Train</text>
  <text x="690" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#f85149">+ Evaluate</text>
  
  <rect x="800" y="240" width="100" height="50" rx="10" fill="#3b1520" stroke="#f85149" stroke-width="2">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" begin="1s"/>
  </rect>
  <text x="850" y="262" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#f85149">📋 Register</text>
  <text x="850" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#f85149">+ Deploy</text>
  
  <rect x="960" y="240" width="100" height="50" rx="10" fill="#3b1520" stroke="#f85149" stroke-width="2">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" begin="1.5s"/>
  </rect>
  <text x="1010" y="262" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#f85149">🎯 Inference</text>
  <text x="1010" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#f85149">+ Monitor</text>
  
  <!-- Labels -->
  <text x="600" y="305" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6e7681">DATA ENGINEERING ────────────────────── │ ──────────────── ML / MLOps</text>
  
  <!-- Flowing dots (animated circles) -->
  <circle r="4" fill="#58a6ff">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 80 0 L 160 0 L 320 0 L 480 0 L 640 0 L 820 0"/>
  </circle>
  <circle r="3" fill="#3fb950">
    <animateMotion dur="4s" repeatCount="indefinite" begin="1s" path="M 80 0 L 160 0 L 320 0 L 480 0 L 640 0 L 820 0"/>
  </circle>
  <circle r="3" fill="#d29922">
    <animateMotion dur="4s" repeatCount="indefinite" begin="2s" path="M 80 0 L 160 0 L 320 0 L 480 0 L 640 0 L 820 0"/>
  </circle>
</svg>
