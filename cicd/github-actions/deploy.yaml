# ============================================================
# CI/CD Pipeline — GitHub Actions
# ============================================================
# Triggers: push to dev/main, PR to main
# Stages: lint → test → build → deploy
# Environment promotion: dev → qa → uat → prod
# ============================================================

name: Data Platform CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1  # CHANGE_ME: your AWS region
  PROJECT: CHANGE_ME
  FEATURE: CHANGE_ME

jobs:
  # ============================================================
  # LINT & STATIC ANALYSIS
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  # ============================================================
  # UNIT TESTS
  # ============================================================
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/unit/ -v --cov=src --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ============================================================
  # DEPLOY TO DEV (on push to dev)
  # ============================================================
  deploy-dev:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      # Upload Glue scripts to S3
      - name: Upload ETL scripts
        run: |
          BUCKET="s3-${PROJECT}-${FEATURE}-dev-artifactory-${{ secrets.AWS_ACCOUNT_ID_DEV }}"
          aws s3 sync src/silver/jobs/ s3://$BUCKET/scripts/ --exclude "*.pyc" --exclude "__pycache__/*"
          aws s3 sync src/gold/marts/ s3://$BUCKET/scripts/ --exclude "*.pyc" --exclude "__pycache__/*"
          aws s3 sync src/consumption/ s3://$BUCKET/scripts/ --exclude "*.pyc" --exclude "__pycache__/*"

      # Load DDB configs
      - name: Load DDB Configs
        run: |
          ENV=dev ./configs/scripts/load_ddb_config.sh

      # Terraform
      - name: Terraform Plan & Apply
        working-directory: infrastructure/terraform/env/dev
        run: |
          terraform init -backend-config=backend.hcl
          terraform plan -var-file=etl-pipeline.tfvars -out=plan.out
          terraform apply plan.out

  # ============================================================
  # DEPLOY TO PROD (on push to main, manual approval)
  # ============================================================
  deploy-prod:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test
    environment: prod  # Requires manual approval in GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload ETL scripts
        run: |
          BUCKET="s3-${PROJECT}-${FEATURE}-prod-artifactory-${{ secrets.AWS_ACCOUNT_ID_PROD }}"
          aws s3 sync src/silver/jobs/ s3://$BUCKET/scripts/ --exclude "*.pyc" --exclude "__pycache__/*"
          aws s3 sync src/gold/marts/ s3://$BUCKET/scripts/ --exclude "*.pyc" --exclude "__pycache__/*"
          aws s3 sync src/consumption/ s3://$BUCKET/scripts/ --exclude "*.pyc" --exclude "__pycache__/*"

      - name: Load DDB Configs
        run: ENV=prod ./configs/scripts/load_ddb_config.sh

      - name: Terraform Apply
        working-directory: infrastructure/terraform/env/prod
        run: |
          terraform init -backend-config=backend.hcl
          terraform plan -var-file=etl-pipeline.tfvars -out=plan.out
          terraform apply plan.out

  # ============================================================
  # DEPLOY TO DATABRICKS (on push to dev or main)
  # ============================================================
  deploy-databricks:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Databricks CLI
        run: pip install databricks-cli
      - name: Configure Databricks
        run: |
          echo "[DEFAULT]" > ~/.databrickscfg
          echo "host = ${{ secrets.DATABRICKS_HOST }}" >> ~/.databrickscfg
          echo "token = ${{ secrets.DATABRICKS_TOKEN }}" >> ~/.databrickscfg
      - name: Deploy Asset Bundle
        working-directory: infrastructure/databricks/asset-bundles
        run: |
          TARGET=${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          databricks bundle deploy -t $TARGET
      - name: Sync notebooks/scripts to workspace
        run: |
          databricks workspace import-dir databricks/src/ /Repos/${{ secrets.DATABRICKS_REPO_PATH }} --overwrite
