# CI: lint + test on every PR
name: CI
on:
  pull_request:
    branches: [main, dev]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements-dev.txt
      - run: make lint
      - run: make test-unit
