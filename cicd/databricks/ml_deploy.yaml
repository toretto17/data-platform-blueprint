# ============================================================
# Databricks ML CI/CD — GitHub Actions
# ============================================================
#
# PURPOSE:
#   Automated CI/CD for Databricks ML workflows using Asset Bundles.
#   Validates, tests, deploys ML jobs (training, inference, monitoring)
#   to dev/staging/prod Databricks workspaces.
#
# FLOW:
#   PR → validate bundle + run unit tests
#   merge to dev → deploy to dev workspace
#   merge to main → deploy to staging (auto) + prod (after approval)
#
# WHAT TO CHANGE:
#   1. DATABRICKS_HOST_* secrets → your workspace URLs
#   2. DATABRICKS_TOKEN_* secrets → your service principal tokens
#   3. BUNDLE_PATH → path to your ml_bundle.yml
#   4. Python version and test commands
#
# PREREQUISITES:
#   - Databricks CLI v0.200+ installed (supports bundles)
#   - Service Principal created per workspace (dev/staging/prod)
#   - SP tokens stored as GitHub secrets
#   - Unity Catalog catalogs created per environment
#
# AUTHENTICATION OPTIONS:
#   Option A: Service Principal tokens (used below — simpler)
#   Option B: Azure AD / OAuth M2M (more secure for enterprise)
#   Option C: Databricks OIDC with GitHub (newest — no stored secrets)
#
# GITHUB SECRETS NEEDED:
#   DATABRICKS_HOST_DEV     — https://your-dev.cloud.databricks.com
#   DATABRICKS_TOKEN_DEV    — dapi... (dev SP token)
#   DATABRICKS_HOST_STAGING — https://your-staging.cloud.databricks.com
#   DATABRICKS_TOKEN_STAGING
#   DATABRICKS_HOST_PROD    — https://your-prod.cloud.databricks.com
#   DATABRICKS_TOKEN_PROD
#
# DOCUMENTATION:
#   - Asset Bundles: https://docs.databricks.com/dev-tools/bundles/
#   - MLOps Stacks: https://docs.databricks.com/machine-learning/mlops/mlops-stacks.html
#   - Lakehouse Monitor: https://docs.databricks.com/lakehouse-monitoring/
#   - UC Model Registry: https://docs.databricks.com/machine-learning/manage-model-lifecycle/
#
# ============================================================

name: Databricks ML CI/CD

on:
  push:
    branches: [dev, main]
    paths:
      - "databricks/**"
      - "cicd/databricks/**"
      - "configs/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "databricks/**"
      - "cicd/databricks/**"

env:
  BUNDLE_PATH: cicd/databricks  # CHANGE_ME: path to your ml_bundle.yml directory
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # VALIDATE: Lint + test + bundle validate on every PR
  # ============================================================
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install ruff pytest mlflow databricks-sdk
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Lint
        run: ruff check databricks/ cicd/databricks/

      - name: Unit tests
        run: pytest tests/databricks/ -v --tb=short 2>/dev/null || echo "No tests found"

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Validate bundle (dev)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          cd ${{ env.BUNDLE_PATH }}
          databricks bundle validate -t dev

  # ============================================================
  # DEPLOY TO DEV (on push to dev branch)
  # ============================================================
  deploy-dev:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: validate
    environment: databricks-dev
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy bundle to dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          cd ${{ env.BUNDLE_PATH }}
          databricks bundle deploy -t dev
          echo "✅ Deployed ML workflows to dev workspace"

      # Optionally run the training job immediately after deploy
      # - name: Trigger training (dev only)
      #   run: |
      #     cd ${{ env.BUNDLE_PATH }}
      #     databricks bundle run model_training_job -t dev

  # ============================================================
  # DEPLOY TO STAGING (on push to main)
  # ============================================================
  deploy-staging:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: validate
    environment: databricks-staging
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy bundle to staging
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGING }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGING }}
        run: |
          cd ${{ env.BUNDLE_PATH }}
          databricks bundle deploy -t staging
          echo "✅ Deployed ML workflows to staging workspace"

      # Run integration test in staging
      - name: Run training integration test
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGING }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGING }}
        run: |
          cd ${{ env.BUNDLE_PATH }}
          # Run training job and wait for completion
          databricks bundle run model_training_job -t staging --no-wait
          echo "Training job triggered in staging — monitor in workspace"

  # ============================================================
  # DEPLOY TO PROD (on push to main, requires approval)
  # ============================================================
  deploy-prod:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: databricks-prod  # Requires manual approval in GitHub
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy bundle to prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: |
          cd ${{ env.BUNDLE_PATH }}
          databricks bundle deploy -t prod
          echo "✅ Deployed ML workflows to prod workspace"

      # Verify deployment
      - name: Verify prod deployment
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: |
          echo "Verifying prod jobs exist..."
          databricks jobs list --output json | python3 -c "
          import json, sys
          jobs = json.loads(sys.stdin.read()).get('jobs', [])
          bundle_jobs = [j for j in jobs if '${bundle.name}' in j.get('settings', {}).get('name', '') or 'CHANGE_ME' in j.get('settings', {}).get('name', '')]
          print(f'Found {len(bundle_jobs)} bundle jobs in prod')
          # CHANGE: Update expected job count
          assert len(bundle_jobs) >= 3, f'Expected >= 3 jobs, found {len(bundle_jobs)}'
          "
          echo "✅ Prod verification passed"

  # ============================================================
  # PROMOTE MODEL (manual workflow dispatch)
  # ============================================================
  promote-model:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: databricks-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install mlflow databricks-sdk

      - name: Promote Challenger → Champion
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
          MLFLOW_TRACKING_URI: databricks
        run: |
          python cicd/databricks/promote_model.py \
            --model-name "${{ github.event.inputs.model_name }}" \
            --from-alias Challenger \
            --to-alias Champion \
            --env prod
